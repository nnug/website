title: NNUG - Norwegian .NET User Group
description: Homepage for Norwegian .NET User Group
lang: nb
url: https://www.nnug.no
repository: nnug/website
permalink: pretty

defaults:
  - scope: { path: "" }
    values: { lang: nb }
  - scope: { path: "en" }
    values: { lang: en }

plugins:
  - jekyll-redirect-from

exclude:
  - README.md
  - LICENSE.txt
  - Gemfile
  - Gemfile.lock
  - vendor
