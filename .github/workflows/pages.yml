# Builds the site with upcoming events from Meetup and publishes it to
# GitHub Pages. Events are fetched fresh on every run and never committed.
#
# Requires Settings → Pages → Source: "GitHub Actions".

name: Build and deploy site

on:
  push:
    branches: [master]
  schedule:
    - cron: "17 */6 * * *" # Every 6 hours (UTC), off the hour to avoid busy times.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Fetch upcoming Meetup events
        run: ruby _scripts/fetch_meetup_events.rb

      - id: pages
        uses: actions/configure-pages@v5

      - name: Build with Jekyll
        run: bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}"
        env:
          JEKYLL_ENV: production

      - uses: actions/upload-pages-artifact@v3

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
