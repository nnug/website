{% assign chapter = include.chapter %}
{% assign t = site.data.i18n[page.lang] %}
<article class="chapter-card" id="{{ chapter.meetup }}">
    <a class="chapter-logo" href="https://www.meetup.com/{{ chapter.meetup }}/">
        <img alt="{{ t.meetup_group_for }} {{ chapter.name }}" src="{{ '/assets/images/' | append: chapter.logo | relative_url }}" />
    </a>
    <div class="chapter-body">
        <a class="all-events" href="https://www.meetup.com/{{ chapter.meetup }}/events/">{{ t.upcoming_events }} →</a>
    </div>
    <div class="chapter-footer">
        <a class="button button-primary" href="https://www.meetup.com/{{ chapter.meetup }}/join/">{{ t.join_meetup }}</a>
        {%- if chapter.twitter %}
        <a class="button button-secondary" href="https://x.com/{{ chapter.twitter }}" aria-label="{{ t.follow_on_x }}: @{{ chapter.twitter }}"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>@{{ chapter.twitter }}</a>
        {%- endif %}
    </div>
</article>
